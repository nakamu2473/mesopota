<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>楔形文字手書き — P3</title>
<style>
  @font-face {
    font-family: "Noto Sans Cuneiform";
    src: url("fonts/NotoSansCuneiform.woff2") format("woff2");
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, sans-serif;
    background: #8a7355;
    color: #3d2f1f;
    overscroll-behavior: none;
  }
  .cune { font-family: "Noto Sans Cuneiform", sans-serif; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px;
    overflow: auto;
  }
  #left, #right {
    width: min(92vw, 420px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* --- 出題チップ（モバイルは横スクロール1行で省スペース） --- */
  #chips {
    display: flex;
    flex-wrap: nowrap;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 3px;
  }
  .chip {
    font: inherit;
    border: none;
    border-radius: 4px;
    background: rgba(232, 220, 200, 0.5);
    color: #3d2f1f;
    cursor: pointer;
    padding: 4px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 44px;
    flex-shrink: 0;
  }
  .chip .g { font-family: "Noto Sans Cuneiform", sans-serif; font-size: 22px; line-height: 1.2; }
  .chip .r { font-size: 10px; opacity: 0.7; }
  .chip.sel { background: #5c4a33; color: #e8dcc8; }
  /* --- お手本カード --- */
  #sign-card {
    display: flex;
    gap: 14px;
    align-items: center;
    background: rgba(232, 220, 200, 0.5);
    border-radius: 4px;
    padding: 10px 14px;
    min-height: 96px;
  }
  #sign-card .glyph {
    font-family: "Noto Sans Cuneiform", sans-serif;
    font-size: 64px;
    line-height: 1;
    min-width: 76px;
    text-align: center;
  }
  #sign-card .info { font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
  #sign-card .rd { font-size: 16px; font-weight: 700; }
  #sign-card .uni { font-size: 10px; opacity: 0.6; }
  /* --- キャンバス --- */
  #board-wrap { position: relative; width: 100%; }
  .fab {
    position: absolute;
    top: 8px;
    font: inherit;
    font-size: 14px;
    padding: 7px 11px;
    border: none;
    border-radius: 4px;
    background: rgba(92, 74, 51, 0.8);
    color: #e8dcc8;
    cursor: pointer;
    touch-action: manipulation;
  }
  .fab:disabled { opacity: 0.35; cursor: default; }
  #btn-undo { right: 82px; }
  #btn-clear { right: 8px; }
  #board {
    width: 100%;
    aspect-ratio: 1;
    background: #c8a878;
    border: 2px solid #5c4a33;
    border-radius: 4px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: crosshair;
    display: block;
  }
  #ghost {
    font-family: "Noto Sans Cuneiform", sans-serif;
    fill: #3d2f1f;
    opacity: 0.15;
    pointer-events: none;
  }
  #trace-row { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button.tb {
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border: none;
    border-radius: 4px;
    background: #5c4a33;
    color: #e8dcc8;
    cursor: pointer;
  }
  button.tb:disabled { opacity: 0.4; cursor: default; }
  #stroke-list {
    list-style: none;
    max-height: 120px;
    overflow-y: auto;
    background: rgba(232, 220, 200, 0.5);
    border-radius: 4px;
    font-size: 13px;
  }
  #stroke-list:empty { display: none; }
  #stroke-list li { padding: 3px 10px; }
  #stroke-list li.last { background: rgba(92, 74, 51, 0.25); font-weight: 600; }
  #stroke-list .num { display: inline-block; min-width: 2em; opacity: 0.6; }
  footer {
    padding: 6px 14px;
    background: #5c4a33;
    color: #e8dcc8;
    font-size: 13px;
    min-height: 30px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  #warn { color: #f0b0a0; }
  @media (min-width: 820px) {
    main { flex-direction: row; justify-content: center; align-items: flex-start; }
    #left { width: 340px; }
    #right { width: min(60vh, 420px); }
    #stroke-list { max-height: 200px; }
    #chips { flex-wrap: wrap; overflow-x: visible; }
  }
</style>
</head>
<body>
<main>
  <div id="left">
    <div id="chips"></div>
    <div id="sign-card"></div>
  </div>
  <div id="right">
    <div id="board-wrap">
      <svg id="board" viewBox="0 0 300 300">
        <text id="ghost" font-size="100" text-anchor="middle"></text>
        <g id="strokes-layer"></g>
      </svg>
      <button class="fab" id="btn-undo" disabled>↩ undo</button>
      <button class="fab" id="btn-clear" disabled>クリア</button>
    </div>
    <label id="trace-row">
      <input type="checkbox" id="trace-toggle" checked>
      お手本を薄く重ねる（なぞり書き）
    </label>
    <div id="toolbar">
      <button class="tb" id="btn-save" disabled>JSON保存</button>
      <button class="tb" id="btn-load">JSON読込</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
    <ol id="stroke-list"></ol>
  </div>
</main>
<footer>
  <span id="status">お手本を選ぶか、そのままドラッグしてください</span>
  <span id="warn"></span>
</footer>
<script>
"use strict";

// ---- 出題リスト（設計メモ 5: 手入力で追加していく方式）----
// 音価・意味は基礎資料で確認済みの頻出サイン。講座で習ったら差し替え/追記する。
const SIGNS = [
  { char: "𒀸", cp: "U+12038", name: "AŠ",    reading: "aš",         meaning: "横楔1本だけの最も単純な字。数の「1」にも使う" },
  { char: "𒁹", cp: "U+12079", name: "DIŠ",   reading: "diš",        meaning: "縦楔1本。数の「1」・人名の前に置く限定符" },
  { char: "𒌋", cp: "U+1230B", name: "U",     reading: "u",          meaning: "ウィンケルハーケン1つ。数の「10」" },
  { char: "𒀀", cp: "U+12000", name: "A",     reading: "a",          meaning: "水。最頻出の字のひとつ" },
  { char: "𒀭", cp: "U+1202D", name: "AN",    reading: "an / diĝir", meaning: "天・神。神名の前の限定符（DINGIR）" },
  { char: "𒈬", cp: "U+1222C", name: "MU",    reading: "mu",         meaning: "名前・年" },
  { char: "𒆠", cp: "U+121A0", name: "KI",    reading: "ki",         meaning: "大地・場所。地名の後ろの限定符" },
  { char: "𒌓", cp: "U+12313", name: "UD",    reading: "ud / utu",   meaning: "太陽・日。太陽神ウトゥ" },
  { char: "𒅗", cp: "U+12157", name: "KA",    reading: "ka",         meaning: "口" },
  { char: "𒅆", cp: "U+12146", name: "IGI",   reading: "igi",        meaning: "目・見る" },
  { char: "𒄑", cp: "U+12111", name: "GIŠ",   reading: "giš",        meaning: "木。木製品の前の限定符" },
  { char: "𒃲", cp: "U+120F2", name: "GAL",   reading: "gal",        meaning: "大きい" },
  { char: "𒂍", cp: "U+1208D", name: "E₂",    reading: "e₂",         meaning: "家・神殿" },
  { char: "𒊭", cp: "U+122AD", name: "ŠA",    reading: "ša",         meaning: "音節「シャ」。アッカド語で頻出" },
  { char: "𒈗", cp: "U+12217", name: "LUGAL", reading: "lugal",      meaning: "王。「大きい人（LU₂.GAL）」に由来" },
  // --- 追加語彙 ---
  { char: "𒂗", cp: "U+12097", name: "EN",    reading: "en",         meaning: "主・領主。神殿長エン" },
  { char: "𒆳", cp: "U+121B3", name: "KUR",   reading: "kur",        meaning: "山・異国の地" },
  { char: "𒇽", cp: "U+121FD", name: "LU₂",   reading: "lu₂",        meaning: "人・男。職業名の前の限定符" },
  { char: "𒊕", cp: "U+12295", name: "SAG",   reading: "sag",        meaning: "頭" },
  { char: "𒊺", cp: "U+122BA", name: "ŠE",    reading: "še",         meaning: "大麦・穀物" },
  { char: "𒋗", cp: "U+122D7", name: "ŠU",    reading: "šu",         meaning: "手" },
  { char: "𒋾", cp: "U+122FE", name: "TI",    reading: "ti",         meaning: "矢。「生きる（til₃）」にも使う" },
  { char: "𒌨", cp: "U+12328", name: "UR",    reading: "ur",         meaning: "犬・獣" },
  { char: "𒁺", cp: "U+1207A", name: "DU",    reading: "du",         meaning: "行く。足の形に由来" },
  { char: "𒄀", cp: "U+12100", name: "GI",    reading: "gi",         meaning: "葦。楔を書く葦ペンの材料" },
  { char: "𒊩", cp: "U+122A9", name: "SAL",   reading: "sal / munus", meaning: "女性。女性名の限定符" },
  { char: "𒌉", cp: "U+12309", name: "TUR",   reading: "tur / dumu", meaning: "小さい・子。DUMU=息子" },
  // --- 追加音節 ---
  { char: "𒁀", cp: "U+12040", name: "BA",    reading: "ba",         meaning: "音節「バ」。「分け与える」" },
  { char: "𒈠", cp: "U+12220", name: "MA",    reading: "ma",         meaning: "音節「マ」" },
  { char: "𒈨", cp: "U+12228", name: "ME",    reading: "me",         meaning: "音節「メ」。神々の力「メ」" },
  { char: "𒈾", cp: "U+1223E", name: "NA",    reading: "na",         meaning: "音節「ナ」" },
  { char: "𒉌", cp: "U+1224C", name: "NI",    reading: "ni",         meaning: "音節「ニ」。油（i₃）にも使う" },
  { char: "𒊏", cp: "U+1228F", name: "RA",    reading: "ra",         meaning: "音節「ラ」" },
  { char: "𒋫", cp: "U+122EB", name: "TA",    reading: "ta",         meaning: "音節「タ」。「〜から」" },
  { char: "𒍪", cp: "U+1236A", name: "ZU",    reading: "zu",         meaning: "知る。音節「ズ」" },
];

// ---- 定数 ----
const VIEW = 300;
const TAP_THRESHOLD = 12;
const INK = "#3d2f1f";
const WH_SIZE = 12;
const GHOST_FIT = 240; // お手本をキャンバス内に収める最大サイズ

const TYPE_LABEL = {
  vertical: "縦楔",
  horizontal: "横楔",
  oblique: "斜め楔",
  winkelhaken: "ウィンケルハーケン",
};

// ---- 状態 ----
const glyph = { strokes: [] };
let currentSign = null; // SIGNS の要素 or null（自由練習）
let dragStart = null;

const board = document.getElementById("board");
const strokesLayer = document.getElementById("strokes-layer");
const ghostEl = document.getElementById("ghost");
const chipsEl = document.getElementById("chips");
const cardEl = document.getElementById("sign-card");
const traceToggle = document.getElementById("trace-toggle");
const listEl = document.getElementById("stroke-list");
const statusEl = document.getElementById("status");
const warnEl = document.getElementById("warn");
const btnUndo = document.getElementById("btn-undo");
const btnClear = document.getElementById("btn-clear");
const btnSave = document.getElementById("btn-save");
const btnLoad = document.getElementById("btn-load");
const fileInput = document.getElementById("file-input");
const SVG_NS = "http://www.w3.org/2000/svg";
let previewEl = null;
let warnTimer = null;

// ---- 出題 UI ----
function buildChips() {
  const free = document.createElement("button");
  free.className = "chip";
  free.innerHTML = `<span class="g">✏</span><span class="r">自由</span>`;
  free.addEventListener("click", () => selectSign(null));
  chipsEl.appendChild(free);
  for (const sign of SIGNS) {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `<span class="g">${sign.char}</span><span class="r">${sign.reading}</span>`;
    b.addEventListener("click", () => selectSign(sign));
    chipsEl.appendChild(b);
  }
}

function selectSign(sign) {
  currentSign = sign;
  if (sign) glyph.targetChar = sign.char;
  else delete glyph.targetChar;
  [...chipsEl.children].forEach((b, i) => {
    b.classList.toggle("sel", sign ? SIGNS[i - 1] === sign : i === 0);
  });
  renderCard();
  renderGhost();
}

function renderCard() {
  if (!currentSign) {
    cardEl.innerHTML = `<div class="info"><div class="rd">自由練習</div>
      <div>ドラッグ=楔を打つ（左→右 / 上→下 / 左上→右下）・タップ=ウィンケルハーケン。上の字を選ぶと練習モードになります。</div></div>`;
    return;
  }
  const s = currentSign;
  cardEl.innerHTML = `
    <div class="glyph">${s.char}</div>
    <div class="info">
      <div class="rd">${s.name} <small>[${s.reading}]</small></div>
      <div>${s.meaning}</div>
      <div class="uni">${s.cp} CUNEIFORM SIGN ${s.name.replace(/Š/g, "SH").replace(/₂/g, "2")}</div>
    </div>`;
}

// お手本をキャンバス中央に薄く表示（フォント読み込み後にサイズを実測して収める）
function renderGhost() {
  const show = currentSign && traceToggle.checked;
  ghostEl.textContent = show ? currentSign.char : "";
  if (!show) return;
  ghostEl.removeAttribute("transform");
  const bb = ghostEl.getBBox();
  if (bb.width === 0) return;
  const s = Math.min(GHOST_FIT / bb.width, GHOST_FIT / bb.height);
  const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
  ghostEl.setAttribute("transform",
    `translate(${VIEW / 2} ${VIEW / 2}) scale(${s.toFixed(3)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`);
}

traceToggle.addEventListener("change", renderGhost);

// ---- 分類（設計メモ 3.2）----
function classify(dx, dy, len) {
  if (len < TAP_THRESHOLD) return "winkelhaken";
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  if (angle >= -22.5 && angle < 22.5) return "horizontal";
  if (angle >= 22.5 && angle < 67.5) return "oblique";
  if (angle >= 67.5 && angle <= 112.5) return "vertical";
  return null; // 右→左・下→上などは葦ペンでは打てない方向
}

// ---- 描画（三角形の頭 + 先細りの尾）----
function wedgePoints(x, y, ex, ey) {
  const dx = ex - x, dy = ey - y;
  const len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len;
  const px = -uy, py = ux;
  const hw = Math.min(11, Math.max(5.5, len * 0.16));
  const hl = hw * 1.7;
  const tw = Math.max(1.2, hw * 0.28);
  const pts = [
    [x + px * hw, y + py * hw],
    [x - px * hw, y - py * hw],
    [x + ux * hl - px * tw, y + uy * hl - py * tw],
    [ex, ey],
    [x + ux * hl + px * tw, y + uy * hl + py * tw],
  ];
  return pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
}

function makeStrokeEl(type, x, y, ex, ey) {
  if (type === "winkelhaken") {
    const s = WH_SIZE;
    const el = document.createElementNS(SVG_NS, "path");
    el.setAttribute("d",
      `M ${x + s} ${y - s * 0.8} L ${x} ${y} L ${x + s} ${y + s * 0.8}`);
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", INK);
    el.setAttribute("stroke-width", "5.5");
    el.setAttribute("stroke-linejoin", "miter");
    return el;
  }
  const el = document.createElementNS(SVG_NS, "polygon");
  el.setAttribute("points", wedgePoints(x, y, ex, ey));
  el.setAttribute("fill", INK);
  return el;
}

function strokeEnd(s) {
  const rad = s.angle * Math.PI / 180;
  return { ex: s.x + Math.cos(rad) * s.length, ey: s.y + Math.sin(rad) * s.length };
}

// ---- 再描画（データ → 画面）----
function render() {
  strokesLayer.innerHTML = "";
  listEl.innerHTML = "";
  for (const s of glyph.strokes) {
    const { ex, ey } = strokeEnd(s);
    strokesLayer.appendChild(makeStrokeEl(s.type, s.x, s.y, ex, ey));
    const li = document.createElement("li");
    li.innerHTML = `<span class="num">${s.order}.</span>${TYPE_LABEL[s.type]}` +
      (s.type === "winkelhaken" ? "" : ` <small>(${s.angle}°, ${s.length}px)</small>`);
    listEl.appendChild(li);
  }
  if (listEl.lastChild) {
    listEl.lastChild.classList.add("last");
    listEl.scrollTop = listEl.scrollHeight;
  }
  const n = glyph.strokes.length;
  btnUndo.disabled = btnClear.disabled = btnSave.disabled = n === 0;
  if (n === 0) statusEl.textContent = "お手本を選ぶか、そのままドラッグしてください";
}

// ---- 入力（Pointer Events）----
function localPos(e) {
  const r = board.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * VIEW / r.width,
    y: (e.clientY - r.top) * VIEW / r.height,
  };
}

// touch-action: none が効かない環境でも縦ドラッグがスクロールや
// pull-to-refresh に化けないよう、キャンバス上のタッチは既定動作ごと止める
for (const ev of ["touchstart", "touchmove"]) {
  board.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}

board.addEventListener("pointerdown", (e) => {
  board.setPointerCapture(e.pointerId);
  dragStart = localPos(e);
});

board.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  const p = localPos(e);
  const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
  const len = Math.hypot(dx, dy);
  const type = classify(dx, dy, len);

  if (previewEl) previewEl.remove();
  if (type) {
    previewEl = makeStrokeEl(type, dragStart.x, dragStart.y, p.x, p.y);
    previewEl.setAttribute("opacity", "0.35");
  } else {
    previewEl = document.createElementNS(SVG_NS, "line");
    previewEl.setAttribute("x1", dragStart.x);
    previewEl.setAttribute("y1", dragStart.y);
    previewEl.setAttribute("x2", p.x);
    previewEl.setAttribute("y2", p.y);
    previewEl.setAttribute("stroke", "#a04030");
    previewEl.setAttribute("stroke-width", "2");
    previewEl.setAttribute("stroke-dasharray", "4 4");
  }
  board.appendChild(previewEl);
});

function endDrag(e) {
  if (!dragStart) return;
  const start = dragStart;
  dragStart = null;
  if (previewEl) { previewEl.remove(); previewEl = null; }
  if (e.type === "pointercancel") return;

  const p = localPos(e);
  const dx = p.x - start.x, dy = p.y - start.y;
  const len = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  const type = classify(dx, dy, len);

  if (!type) {
    showWarn("⚠ 楔は 左→右・上→下・左上→右下 にしか打てません");
    return;
  }

  glyph.strokes.push({
    type,
    x: Math.round(start.x * 10) / 10,
    y: Math.round(start.y * 10) / 10,
    angle: Math.round(angle * 10) / 10,
    length: Math.round(len * 10) / 10,
    order: glyph.strokes.length + 1,
    timestamp: Date.now(),
  });
  render();

  const s = glyph.strokes[glyph.strokes.length - 1];
  statusEl.textContent = s.type === "winkelhaken"
    ? `${s.order}打目: ${TYPE_LABEL[s.type]}`
    : `${s.order}打目: ${TYPE_LABEL[s.type]} (${s.angle}°, ${s.length}px)`;
}

board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", endDrag);
board.addEventListener("contextmenu", (e) => e.preventDefault());

// ---- ツールバー ----
btnUndo.addEventListener("click", () => {
  glyph.strokes.pop();
  render();
});

btnClear.addEventListener("click", () => {
  glyph.strokes.length = 0;
  render();
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "z" && glyph.strokes.length) {
    e.preventDefault();
    glyph.strokes.pop();
    render();
  }
});

// ---- JSON 書き出し / 読み込み ----
btnSave.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(glyph, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const label = currentSign ? currentSign.name.replace("₂", "2") : "free";
  a.download = `glyph-${label}-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  statusEl.textContent = `JSON保存: ${glyph.strokes.length}打`;
});

btnLoad.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    loadGlyph(data);
    statusEl.textContent = `JSON読込: ${glyph.strokes.length}打`;
  } catch (err) {
    showWarn("⚠ JSONを読み込めません: " + err.message);
  }
});

function loadGlyph(data) {
  if (!data || !Array.isArray(data.strokes)) {
    throw new Error("strokes 配列がありません");
  }
  const strokes = data.strokes.map((s, i) => {
    if (!TYPE_LABEL[s.type]) throw new Error(`${i + 1}番目: 不明なtype "${s.type}"`);
    if (![s.x, s.y, s.angle, s.length].every(Number.isFinite)) {
      throw new Error(`${i + 1}番目: x/y/angle/length が不正です`);
    }
    return { ...s, order: i + 1 };
  });
  glyph.strokes.length = 0;
  glyph.strokes.push(...strokes);
  // targetChar が出題リストにあればお手本も復元する
  selectSign(SIGNS.find(sg => sg.char === data.targetChar) || null);
  render();
}

function showWarn(msg) {
  warnEl.textContent = msg;
  clearTimeout(warnTimer);
  warnTimer = setTimeout(() => { warnEl.textContent = ""; }, 2500);
}

buildChips();
selectSign(null);
render();
// フォント読み込み完了後にお手本サイズを実測し直す
document.fonts.ready.then(renderGhost);
</script>
</body>
</html>
